services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polymarket_history
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d polymarket_history"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:

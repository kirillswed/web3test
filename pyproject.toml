[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polymarket-history"
version = "0.1.0"
description = "Reconstruct Polymarket wallet history directly from Polygon RPC"
requires-python = ">=3.12"
dependencies = [
  "eth-abi",
  "eth-utils",
  "httpx",
  "psycopg[binary]",
  "python-dotenv",
  "sqlalchemy",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
polymarket-history = "polymarket_history.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["polymarket_history"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
